apiVersion: apps/v1
kind: Deployment
metadata:
  name: little-lemon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: little-lemon
  template:
    metadata:
      labels:
        app: little-lemon
    spec:
      containers:
      - name: little-lemon
        image: keroles149/little-lemon:latest
        ports:
        - containerPort: 8000
        imagePullPolicy: IfNotPresent
        env:
        - name: DEBUG
          value: "False"
        # Resource requests/limits required for HPA based on memory
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 20
          failureThreshold: 3

